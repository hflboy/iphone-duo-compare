name: capture-shots

# 自动/手动触发:在 CI 里用无头 Chromium 重新生成 docs/shots/ 下的预览图并提交回来。
# 本地也可以直接 `npm run capture`,效果一致。
on:
  workflow_dispatch:
    inputs:
      frames:
        description: 动图帧数(默认 12,越小文件越小)
        required: false
        default: "12"
  push:
    paths:
      - "models/**"
      - "tools/capture.mjs"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: capture-shots
  cancel-in-progress: true

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # 软件渲染很慢,给足时间但也别无限挂着
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Diagnose
        run: |
          node -v
          echo "--- node_modules ---"
          ls node_modules | head -30
          echo "--- playwright browsers ---"
          ls -la ~/.cache/ms-playwright || true

      - name: Capture
        id: cap
        continue-on-error: true
        shell: bash
        timeout-minutes: 12
        env:
          CAPTURE_FRAMES: ${{ inputs.frames }}
        run: |
          set -o pipefail
          npm run capture 2>&1 | tee /tmp/capture.log

      - name: Commit shots
        if: steps.cap.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .ci/capture-error.txt
          git add docs/shots
          if git diff --staged --quiet; then
            echo "没有变化,跳过提交"
          else
            git commit -m "chore(shots): refresh render previews"
            git push
          fi

      # 失败时把日志落到仓库里,方便在网页/API 上直接看到真实报错
      - name: Publish failure log
        if: steps.cap.outcome == 'failure'
        run: |
          mkdir -p .ci
          tail -c 20000 /tmp/capture.log > .ci/capture-error.txt || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/capture-error.txt
          git commit -m "chore(ci): capture 失败日志 [skip ci]" || true
          git push || true

      - name: Fail job if capture failed
        if: steps.cap.outcome == 'failure'
        run: exit 1
