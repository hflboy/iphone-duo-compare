<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#030509">
<meta name="description" content="iPhone Duo 交互式 3D 拆解实验室 —— 基于 Three.js 的折叠屏 iPhone 拆解可视化">
<title>iPhone DUO · 交互式 3D 拆解实验室</title>
<style>
:root{
  --bg:#030509;
  --panel:rgba(9,15,26,.78);
  --line:rgba(110,160,255,.16);
  --cyan:#22d3ee;
  --text:#dce8f6;
  --dim:#8296ad;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none}
#scene{position:fixed;inset:0;display:block;touch-action:none}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(0,0,5,.55) 100%)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);
  box-shadow:0 8px 32px rgba(0,0,10,.45)}

#hud-top{position:fixed;top:18px;left:22px;z-index:10;pointer-events:none}
#hud-top h1{font-size:26px;font-weight:800;letter-spacing:2px;
  background:linear-gradient(90deg,#e0f2fe,#22d3ee 55%,#a78bfa);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#hud-top p{margin-top:4px;font-size:12px;color:var(--dim);letter-spacing:1px}

#toolbar{position:fixed;top:18px;right:22px;z-index:10;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{pointer-events:auto;cursor:pointer;border:1px solid var(--line);background:rgba(13,22,37,.72);
  color:var(--text);font-size:13px;padding:8px 14px;border-radius:10px;transition:all .18s;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn:hover{border-color:rgba(34,211,238,.5);box-shadow:0 0 14px rgba(34,211,238,.22);color:#bdf3ff}
.btn.active{background:rgba(34,211,238,.14);border-color:rgba(34,211,238,.55);color:#9ff0ff;box-shadow:0 0 16px rgba(34,211,238,.3)}
.slider-row{display:flex;align-items:center;gap:10px;padding:8px 14px;pointer-events:auto}
.slider-row label{font-size:12px;color:var(--dim);white-space:nowrap}
#explode-slider{-webkit-appearance:none;appearance:none;width:170px;height:4px;border-radius:2px;
  background:linear-gradient(90deg,#22d3ee,#3b82f6);outline:none;cursor:pointer}
#explode-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:#22d3ee;box-shadow:0 0 10px rgba(34,211,238,.8);cursor:pointer}
#explode-slider::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;
  background:#22d3ee;box-shadow:0 0 10px rgba(34,211,238,.8)}
#slider-val{font-size:12px;color:#9ff0ff;width:38px;text-align:right}
#explode-state{font-size:12px;color:var(--dim);white-space:nowrap}

#parts-list{position:fixed;left:22px;bottom:20px;z-index:10;width:246px;max-height:44vh;
  display:flex;flex-direction:column;pointer-events:auto;overflow:hidden}
#parts-list h3{font-size:12px;color:var(--dim);letter-spacing:2px;padding:10px 14px 6px;
  border-bottom:1px solid var(--line);font-weight:600}
#parts-ul{list-style:none;overflow-y:auto;padding:6px}
#parts-ul::-webkit-scrollbar{width:4px}
#parts-ul::-webkit-scrollbar-thumb{background:rgba(34,211,238,.3);border-radius:2px}
#parts-ul li{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;
  cursor:pointer;font-size:12.5px;color:var(--text);transition:background .15s}
#parts-ul li:hover{background:rgba(34,211,238,.10)}
#parts-ul li.active{background:rgba(34,211,238,.16);color:#9ff0ff}
#parts-ul .idx{font-family:Consolas,monospace;font-size:11px;color:var(--cyan);opacity:.8}

#info-panel{position:fixed;right:22px;top:150px;z-index:10;width:310px;
  max-height:calc(100vh - 260px);overflow-y:auto;padding:18px;
  transform:translateX(120%);opacity:0;transition:all .35s cubic-bezier(.2,.8,.25,1);pointer-events:none}
#info-panel.show{transform:none;opacity:1;pointer-events:auto}
#ip-state{display:inline-block;font-size:11px;color:#9ff0ff;border:1px solid rgba(34,211,238,.4);
  border-radius:20px;padding:2px 10px;margin-bottom:8px}
#ip-en{font-size:11px;color:var(--cyan);letter-spacing:1px;margin-bottom:2px}
#ip-name{font-size:18px;font-weight:700;margin-bottom:10px}
#ip-desc{font-size:12.5px;line-height:1.75;color:#aebfd4;margin-bottom:12px}
#ip-specs{width:100%;border-collapse:collapse}
#ip-specs td{font-size:12px;padding:6px 4px;border-top:1px dashed rgba(110,160,255,.14);color:#c4d4e6}
#ip-specs td:first-child{color:var(--dim);width:78px;white-space:nowrap}
#ip-close{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--dim);font-size:16px;
  background:none;border:none}
#ip-close:hover{color:#fff}

#hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9;font-size:11.5px;
  color:var(--dim);letter-spacing:.5px;padding:7px 16px;white-space:nowrap;max-width:94vw;overflow:hidden}
#hint b{color:#9ff0ff;font-weight:600}

#tooltip{position:fixed;z-index:20;pointer-events:none;background:rgba(8,14,24,.9);
  border:1px solid rgba(34,211,238,.4);color:#bdf3ff;font-size:12px;padding:5px 10px;
  border-radius:8px;opacity:0;transition:opacity .12s;box-shadow:0 0 14px rgba(34,211,238,.2)}
#tooltip.show{opacity:1}

#credits{position:fixed;bottom:16px;right:22px;z-index:9;font-size:10.5px;
  color:rgba(130,150,173,.55);text-align:right;line-height:1.5;pointer-events:none}

#loader{position:fixed;inset:0;z-index:99;background:#020409;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;transition:opacity .6s}
#loader.hide{opacity:0;pointer-events:none}
.load-ring{width:46px;height:46px;border-radius:50%;border:3px solid rgba(34,211,238,.15);
  border-top-color:#22d3ee;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{font-size:13px;color:var(--dim);letter-spacing:2px}

@media (max-width:860px){
  #parts-list{display:none}
  #hint{display:none}
  #credits{display:none}
  #hud-top h1{font-size:20px}
  #toolbar{top:auto;bottom:14px;right:12px;left:12px;align-items:center}
  .btn-row{justify-content:center}
  .btn{padding:7px 10px;font-size:12px}
  #info-panel{width:calc(100vw - 24px);right:12px;top:auto;bottom:118px;max-height:40vh}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>

<header id="hud-top">
  <h1>iPhone DUO</h1>
  <p>交互式 3D 拆解实验室 · 首款折叠屏 iPhone · Three.js 程序化建模</p>
</header>

<div id="toolbar">
  <div class="btn-row">
    <button class="btn" id="btn-explode" title="全部拆解(空格)">🔓 整体拆解</button>
    <button class="btn" id="btn-assemble" title="全部组装(空格)">🔗 一键组装</button>
    <button class="btn" id="btn-fold" title="开合折叠(F)">⇱ 折叠</button>
  </div>
  <div class="btn-row">
    <button class="btn" id="btn-tour" title="自动拆解演示">▶ 自动演示</button>
    <button class="btn" id="btn-rotate" title="自动旋转">⟳ 自动旋转</button>
    <button class="btn" id="btn-reset" title="重置视角(R)">⌖ 重置视角</button>
  </div>
  <div class="panel slider-row">
    <label for="explode-slider">拆解进度</label>
    <input type="range" id="explode-slider" min="0" max="100" value="0">
    <span id="slider-val">0%</span>
    <span id="explode-state">已组装</span>
  </div>
</div>

<aside id="parts-list" class="panel">
  <h3>部件清单 · <span id="parts-count">22</span></h3>
  <ul id="parts-ul"></ul>
</aside>

<section id="info-panel" class="panel">
  <button id="ip-close" title="关闭(Esc)">✕</button>
  <div id="ip-state">○ 装配中</div>
  <div id="ip-en"></div>
  <div id="ip-name"></div>
  <div id="ip-desc"></div>
  <table id="ip-specs"></table>
</section>

<div id="hint" class="panel">🖱 <b>拖拽</b>旋转 · <b>滚轮</b>缩放 · <b>右键</b>平移 · 👆 <b>单指</b>旋转 <b>双指</b>缩放/平移 · <b>点击部件</b>拆出/收回 · <b>双击</b>聚焦 · <b>空格</b>拆解/组装 · <b>F</b> 折叠 · <b>Esc</b> 取消</div>

<div id="tooltip"></div>

<div id="credits">结构参考:Apple 官方 iPhone Duo 资料与公开拆解报道(iFixit / REWA / MacRumors)<br>概念演示 · 仅用于学习交流</div>

<div id="loader"><div class="load-ring"></div><div class="load-text">正在构建 iPhone DUO …</div></div>

<!-- Three.js:本地优先,开源公共库 CDN 多级兜底(BootCDN → 360 baomitu → Staticfile → cdnjs → jsdelivr → unpkg) -->

<script>window.THREE||document.write('<script src="https://lib.baomitu.com/three.js/r128/three.min.js"><\/script>');</script>
<script>window.THREE||document.write('<script src="https://cdn.staticfile.org/three.js/r128/three.min.js"><\/script>');</script>
<script>window.THREE||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
<script>window.THREE||document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');</script>

<!-- 应用代码 -->
<script src="js/partsData.js"></script>
<script src="js/bloom.js"></script>
<script src="js/controls.js"></script>
<script src="js/phoneModel.js"></script>
<script src="js/explode.js"></script>
<script src="js/main.js"></script>
</body>
</html>
