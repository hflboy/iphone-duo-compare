<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone Duo · 模型并排对比</title>
<style>
  :root{
    --bg:#05070c; --panel:#0b1119; --line:rgba(120,170,255,.18);
    --text:#e6f0fa; --dim:#8ba0b6; --accent:#3fe6ff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 50% 0%,#0d1a2b 0%,#05070c 60%);
    color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;
  }
  header{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);
    background:rgba(7,11,18,.7);backdrop-filter:blur(14px);
  }
  .brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brand h1{font-size:17px;font-weight:700;letter-spacing:.4px}
  .brand h1 b{color:var(--accent)}
  .brand p{font-size:11.5px;color:var(--dim);letter-spacing:.5px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .actions a{
    font-size:11.5px;color:#c6d8ea;text-decoration:none;padding:7px 12px;border-radius:8px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);transition:.18s;white-space:nowrap;
  }
  .actions a:hover{border-color:rgba(63,230,255,.45);color:#eafcff;box-shadow:0 0 16px rgba(63,230,255,.18)}

  main{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);min-height:0}
  section{display:flex;flex-direction:column;background:var(--panel);min-width:0;min-height:0}
  .pane-head{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 14px;border-bottom:1px solid var(--line);font-size:12px;
  }
  .pane-head .name{display:flex;align-items:center;gap:8px;font-weight:600}
  .pane-head .dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 9px currentColor}
  .pane-head .meta{font-size:10.5px;color:var(--dim);font-family:Consolas,monospace}
  .pane-head a{font-size:10.5px;color:var(--dim);text-decoration:none;border-bottom:1px dotted rgba(139,160,182,.5)}
  .pane-head a:hover{color:var(--accent)}
  iframe{flex:1 1 auto;width:100%;height:100%;border:0;background:#02040a;min-height:0}

  @media (max-width:900px){
    main{grid-template-columns:1fr;grid-template-rows:1fr 1fr;overflow:auto}
    header{padding:10px 12px}
    .brand p{display:none}
    section{min-height:70vh}
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>iPhone <b>Duo</b> · 并排对比</h1>
      <p>同一份提示词,多套独立实现 —— 左右同时交互,直接比手感与画面</p>
    </div>
    <nav class="actions">
      <a href="models/glm-5.3/" target="_blank" rel="noopener">GLM-5.3 全屏 ↗</a>
      <a href="models/deepseek-codex/" target="_blank" rel="noopener">DeepSeek + Codex 全屏 ↗</a>
      <a href="models/deepseek-flash/" target="_blank" rel="noopener">DeepSeek 原版</a>
      <a href="README.md">项目说明</a>
    </nav>
  </header>

  <main>
    <section>
      <div class="pane-head">
        <span class="name"><i class="dot" style="color:#ffb066;background:#ffb066"></i>GLM-5.3-Flash</span>
        <span class="meta">22 部件 · 折叠联动 · 六级 CDN 兜底</span>
        <a href="models/glm-5.3/" target="_blank" rel="noopener">新窗口 ↗</a>
      </div>
      <iframe src="models/glm-5.3/index.html" title="GLM-5.3-Flash 实现" loading="lazy"
              allow="fullscreen" referrerpolicy="no-referrer"></iframe>
    </section>

    <section>
      <div class="pane-head">
        <span class="name"><i class="dot" style="color:#3fe6ff;background:#3fe6ff"></i>DeepSeek-V4.1-Flash + Codex</span>
        <span class="meta">15 部件 · 水滴铰链 · 自动巡览</span>
        <a href="models/deepseek-codex/" target="_blank" rel="noopener">新窗口 ↗</a>
      </div>
      <iframe src="models/deepseek-codex/index.html" title="DeepSeek-V4.1-Flash + Codex 实现" loading="lazy"
              allow="fullscreen" referrerpolicy="no-referrer"></iframe>
    </section>
  </main>
</body>
</html>
